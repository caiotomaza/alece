[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
python_files = ["test_*.py", "tests.py"]
testpaths = ["tests", "src/controller/apps"]
pythonpath = [".", "src/controller"]
markers = [
  "browser: tests that require an installed browser and a Django live server",
  "visual: screenshots reais comparados contra baselines aprovadas por revisão",
  "security: authorization and isolation contracts",
  "integration: Django ORM, HTTP and view integration",
  "unit: pure, database-independent logic",
  "startup: environment and boot preflight",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*/migrations/*", "test_local_request.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
