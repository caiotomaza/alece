name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: alece_test
          POSTGRES_USER: alece_test
          POSTGRES_PASSWORD: ci-only-never-production
        options: >-
          --health-cmd "pg_isready -U alece_test -d alece_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
    env:
      ALECE_SECRET_KEY: ${{ 'ci-test-key-not-for-production-use-please-replace' }}
      ALECE_DB_NAME: alece_test
      ALECE_DB_USER: alece_test
      ALECE_DB_PASSWORD: ci-only-never-production
      ALECE_DB_HOST: 127.0.0.1
      ALECE_DB_PORT: '5432'
      ALECE_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/development.in
      - name: Install test dependencies
        run: python -m pip install -r requirements/development.txt
      - name: Audit production dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements/production.txt
      - name: Static and style checks
        run: |
          python -m compileall -q apps config tests manage.py
          ruff check .
      - name: Django check and migration drift
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Apply migrations and test
        run: |
          python manage.py migrate --noinput
          pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker build
        run: docker build --tag alece:ci .
