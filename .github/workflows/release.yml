name: Release image (não implanta ZimaOS)
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image name
        run: |
          REPO=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "ALECE_IMAGE=ghcr.io/${REPO}:${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.ALECE_IMAGE }}
          # Tag versionada é propositalmente separada de deploy; rever se quiser publicar digest assinado.
