name: alece
services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ALECE_DB_NAME:?Defina ALECE_DB_NAME em .env}
      POSTGRES_USER: ${ALECE_DB_USER:?Defina ALECE_DB_USER em .env}
      POSTGRES_PASSWORD: ${ALECE_DB_PASSWORD:?Defina ALECE_DB_PASSWORD em .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: [.env]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ALECE_BIND_IP:-127.0.0.1}:${ALECE_PORT:-8000}:8000"
    volumes:
      - media:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live/', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks: [internal]
networks:
  internal:
    driver: bridge
volumes:
  dbdata:
  media:
